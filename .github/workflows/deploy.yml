name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build presentations
        run: npm run build

      - name: Assemble site
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.editorconfig' \
            --exclude='.nvmrc' \
            --exclude='_site' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='src' \
            --exclude='docs' \
            --exclude='*.md' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='tsconfig.json' \
            --exclude='vite.config.*' \
            --exclude='eslint.config.*' \
            ./ _site/
          # dist/ is excluded above, so the built app is copied in explicitly
          cp -r dist/presentations _site/presentations

      - name: Smoke-check site
        run: |
          for required in _site/index.html _site/presentations/index.html _site/css/core/design-system.css _site/js/shared/keyboard-nav.js; do
              test -f "$required" || { echo "missing from _site: $required"; exit 1; }
          done
          for forbidden in _site/node_modules _site/src; do
              test ! -e "$forbidden" || { echo "must not ship: $forbidden"; exit 1; }
          done
          leaked=$(find _site \( -name '*.test.*' -o -name '*.md' -o -name 'package*.json' \) -print)
          if [ -n "$leaked" ]; then
              echo "must not ship:"
              echo "$leaked"
              exit 1
          fi
          find _site -maxdepth 1

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
